name: Quality

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reject tracked credential material
        run: python website/backend/scripts/check_tracked_secrets.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: elanora_test
          POSTGRES_USER: elanora_test
          POSTGRES_PASSWORD: elanora-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elanora_test -d elanora_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://elanora_test:elanora-test-only@127.0.0.1:5432/elanora_test
      TEST_DATABASE_URL: postgresql+asyncpg://elanora_test:elanora-test-only@127.0.0.1:5432/elanora_test
      JWT_SECRET_KEY: test-secret-key-for-ci-only
      JWT_ALGORITHM: HS256
      SETUP_TOKEN: elanora-local-setup
      MAIL_FROM: test@ci.example.org
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_USE_CREDENTIALS: false
      ELANORA_BACKUP_PASSPHRASE: test-backup-passphrase-for-ci-only
      # Valid Fernet key for CI tests - generated with:
      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      OUTBOX_ENCRYPTION_KEYS: 7VnAtB9VF3NiUyVViy4qiGoQro_kcbRuvh9egbYKmB8=
      FRONTEND_HOST: http://localhost:8777
      BACKEND_HOST: http://localhost:8018
    defaults:
      run:
        working-directory: website/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: snok/install-poetry@v1
        with:
          version: "2.1.4"
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: website/backend/.venv
          key: backend-${{ runner.os }}-${{ hashFiles('website/backend/poetry.lock') }}
      - run: poetry install --no-interaction
      - run: poetry run ruff format --check .
      - run: poetry run ruff check .
      - run: poetry run mypy --config-file mypy.ini
      - name: Verify the complete PostgreSQL migration chain
        run: |
          poetry run alembic upgrade head
          poetry run alembic check
          poetry run alembic downgrade base
          poetry run alembic upgrade head
      - run: poetry run pytest --cov=app --cov-report=term-missing
      - run: poetry run pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run stylelint
      - run: npm run format
      - run: npm run i18n:check
      - run: npm run test
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --audit-level=high
