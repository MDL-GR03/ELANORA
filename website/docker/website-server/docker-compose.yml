---
services:
  storage-init:
    build:
      context: ../../backend
      dockerfile: ../backend/docker/Dockerfile.prod
    user: "0:0"
    volumes:
      - ../../data:/app/website/data
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/website/data/elanora_projects/.locks /app/website/data/recovery-cache /app/website/data/instance-assets &&
        chown -R 10001:10001 /app/website/data
        /app/website/data/elanora_projects /app/website/data/elanora_projects/.locks
        /app/website/data/recovery-cache /app/website/data/instance-assets
    restart: "no"

  backend:
    build:
      context: ../../backend
      dockerfile: ../backend/docker/Dockerfile.prod
    ports:
      - '8010:8010'
    env_file:
      - ../../env/.env.server
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ELAN_PROJECTS_BASE_PATH: /app/website/data/elanora_projects
      ELAN_BACKUPS_BASE_PATH: /app/website/data/recovery-cache
      INSTANCE_ASSETS_BASE_PATH: /app/website/data/instance-assets
      SYNC_STAGING_BASE_PATH: /app/website/data/sync-staging
    depends_on:
      storage-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    container_name: elanora-website-backend-server
    volumes:
      - ../../data:/app/website/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../frontend/docker/Dockerfile.prod
      args:
        BUILD_MODE: server
    ports:
      - '80:80'
    env_file:
      - ../../env/.env.server
    depends_on:
      - backend
    container_name: elanora-website-frontend-server
    restart: unless-stopped

  outbox-worker:
    build:
      context: ../../backend
      dockerfile: ../backend/docker/Dockerfile.prod
    env_file:
      - ../../env/.env.server
    environment:
      DB_HOST: db
      DB_PORT: 5432
    command: ["python", "-m", "app.cli.dispatch_outbox"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    container_name: elanora-outbox-worker-server

  change-set-worker:
    build:
      context: ../../backend
      dockerfile: ../backend/docker/Dockerfile.prod
    env_file:
      - ../../env/.env.server
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ELAN_PROJECTS_BASE_PATH: /app/website/data/elanora_projects
      ELAN_BACKUPS_BASE_PATH: /app/website/data/recovery-cache
      INSTANCE_ASSETS_BASE_PATH: /app/website/data/instance-assets
      SYNC_STAGING_BASE_PATH: /app/website/data/sync-staging
    command: ["python", "-m", "app.cli.dispatch_change_sets"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../../data:/app/website/data
    restart: unless-stopped
    container_name: elanora-change-set-worker-server

  maintenance-worker:
    build:
      context: ../../backend
      dockerfile: ../backend/docker/Dockerfile.prod
    env_file:
      - ../../env/.env.server
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ELAN_PROJECTS_BASE_PATH: /app/website/data/elanora_projects
      ELAN_BACKUPS_BASE_PATH: /app/website/data/recovery-cache
      INSTANCE_ASSETS_BASE_PATH: /app/website/data/instance-assets
      SYNC_STAGING_BASE_PATH: /app/website/data/sync-staging
      # Backups belong off this host. The bind mount below is the default
      # target so a fresh installation is recoverable without configuration;
      # point it at external storage, or set BACKUP_STORAGE_BACKEND=s3.
      BACKUP_LOCAL_ROOT: /app/website/backups
    command: ["python", "-m", "app.cli.maintenance_worker"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../../data:/app/website/data
      - ../../backups:/app/website/backups
    restart: unless-stopped
    container_name: elanora-maintenance-worker-server

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-elanora}
      POSTGRES_USER: ${DB_USER:-elanora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the Compose environment}
    volumes:
      # PostgreSQL 18 keeps its major-version directory below this mount.
      - elanora_db_server:/var/lib/postgresql
    container_name: elanora-website-db-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  elanora_db_server:
