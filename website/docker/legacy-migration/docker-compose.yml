---
name: elanora-legacy-migration

services:
  importer:
    build:
      context: ../../backend
      dockerfile: ../backend/docker/Dockerfile.dev
    environment:
      ENVIRONMENT: dev
      DB_NAME: elanora
      DB_USER: elanora
      DB_PASSWORD: elanora-migration-local-only
      DB_HOST: db
      DB_PORT: "5432"
      JWT_SECRET_KEY: elanora-migration-jwt-local-only
      FRONTEND_HOST: http://localhost:8777
      BACKEND_HOST: http://localhost:8018
      ELAN_PROJECTS_BASE_PATH: /app/website/data/elanora_projects
      ELAN_BACKUPS_BASE_PATH: /app/website/data/recovery-cache
      LOG_LEVEL: WARNING
      CONSOLE_LOG_LEVEL: WARNING
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head;
        elanora-migrate-legacy
        --dump /app/website/database/dump.sql
        --source-files /static
    volumes:
      - ../../database/dump.sql:/app/website/database/dump.sql:ro
      - ../../static:/static:ro
      - legacy_project_data:/app/website/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: elanora
      POSTGRES_USER: elanora
      POSTGRES_PASSWORD: elanora-migration-local-only
    volumes:
      - legacy_postgres_data:/var/lib/postgresql
    ports:
      - "5417:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  legacy_postgres_data:
  legacy_project_data:
