name: elanora-test

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: elanora_test
      POSTGRES_USER: elanora_test
      POSTGRES_PASSWORD: elanora-test-only
    ports:
      - "127.0.0.1:5418:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
    # Deliberately no volume: `docker compose down` destroys every test row.
    container_name: elanora-test-db
