[mypy]
# New architectural boundaries are strict. The older service layer is migrated
# incrementally instead of hiding hundreds of findings behind global ignores.
files =
    app/elan,
    app/cli,
    app/legacy_migration,
    app/core,
    app/db/database.py,
    app/dependency/project_access.py,
    app/dependency/project_lock.py,
    app/storage,
    app/middleware,
    app/recovery,
    app/model/audit_event.py,
    app/model/eaf_ingestion_attempt.py,
    app/model/eaf_revision.py,
    app/crud/eaf_ingestion_attempt.py,
    app/service/eaf_review.py,
    app/schema/review.py,
    app/model/review.py,
    app/service/review.py,
    app/service/contribution_change_set.py,
    app/service/contribution_inspection.py,
    app/service/contribution_intake.py,
    app/service/contribution_publication.py,
    app/service/contribution_review.py,
    app/service/project_history.py,
    app/service/project_integrity.py,
    app/service/project_lifecycle.py,
    app/service/project_revision.py,
    app/service/project_sync.py,
    app/service/research_topics.py,
    app/service/tier_export.py,
    app/crud/instance.py,
    app/service/instance.py,
    app/service/invitation.py,
    app/api/v1/instance.py,
    app/api/v1/invitation.py,
    app/api/v1/operations.py,
    app/api/v1/protocol.py,
    app/api/v1/review.py,
    app/api/v1/tier.py,
    app/service/tier.py,
    app/api/v1/git.py,
    app/service/git.py,
    app/service/git_status_parser.py,
    app/crud/association.py,
    app/crud/project.py,
    app/crud/elan_file.py,
    app/crud/file_content.py,
    app/crud/elan_file_media.py,
    app/utils/database.py,
    app/crud/annotation.py,
    app/crud/annotation_value.py,
    app/crud/tier.py,
    app/crud/user.py,
    app/crud/invitation.py,
    app/crud/file_type.py,
    app/crud/effective_naming_standard.py,
    app/crud/project_naming_standard.py,
    app/crud/project_location_file_type.py,
    app/crud/accepted_value.py,
    app/crud/component_accepted_value.py,
    app/crud/component_template.py,
    app/crud/standard_component.py
python_version = 3.13
plugins = pydantic.mypy
strict = True
warn_unused_ignores = True
show_error_codes = True
pretty = True
exclude = (^\.venv/|^migrations/)

[mypy-lxml.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-app.legacy_migration.*]
# The importer is strict itself, but calls the incrementally typed legacy ELAN
# service. Do not expand that old service graph while checking this boundary.
follow_imports = skip
