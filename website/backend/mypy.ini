[mypy]
# Every application module is checked strictly. New code must keep it so.
files = app
python_version = 3.13
plugins = pydantic.mypy
strict = True
warn_unused_ignores = True
show_error_codes = True
pretty = True
exclude = (^\.venv/|^migrations/)

[mypy-lxml.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-app.legacy_migration.*]
# The importer is strict itself, but calls the incrementally typed legacy ELAN
# service. Do not expand that old service graph while checking this boundary.
follow_imports = skip
